name: SBOM Generation

on:
  release:
    types:
      - published
  schedule:
    # Runs every Wednesday at 07:00 UTC
    - cron: "0 7 * * 3"
  workflow_dispatch:
    inputs:
      attach_to_release:
        description: "Attach SBOM to the latest release"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read
  id-token: write  # required for OIDC signing with cosign

jobs:
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    outputs:
      sbom_artifact_name: ${{ steps.set-artifact-name.outputs.name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Determine SBOM artifact name
        id: set-artifact-name
        run: |
          REPO_SLUG=$(echo "${{ github.repository }}" | tr '/' '-')
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="$(date -u '+%Y%m%d')-${{ github.sha }}"
          fi
          NAME="${REPO_SLUG}-sbom-${VERSION}"
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Generate SBOM with Syft (SPDX JSON)
        uses: anchore/sbom-action@v0
        id: sbom
        with:
          path: "."
          format: spdx-json
          output-file: "${{ steps.set-artifact-name.outputs.name }}.spdx.json"
          artifact-name: "${{ steps.set-artifact-name.outputs.name }}.spdx.json"
          upload-artifact: true
          upload-artifact-retention: 90

      - name: Generate SBOM with Syft (CycloneDX JSON — secondary format)
        uses: anchore/sbom-action@v0
        with:
          path: "."
          format: cyclonedx-json
          output-file: "${{ steps.set-artifact-name.outputs.name }}.cyclonedx.json"
          artifact-name: "${{ steps.set-artifact-name.outputs.name }}.cyclonedx.json"
          upload-artifact: true
          upload-artifact-retention: 90

      - name: Validate SPDX SBOM
        run: |
          SBOM_FILE="${{ steps.set-artifact-name.outputs.name }}.spdx.json"
          if [ ! -f "$SBOM_FILE" ]; then
            echo "::error::SBOM file not found: $SBOM_FILE"
            exit 1
          fi

          # Basic structural validation
          SPDX_VERSION=$(jq -r '.spdxVersion // empty' "$SBOM_FILE")
          if [ -z "$SPDX_VERSION" ]; then
            echo "::error::SBOM is missing spdxVersion field"
            exit 1
          fi

          PACKAGE_COUNT=$(jq '.packages | length' "$SBOM_FILE")
          echo "SBOM validated: SPDX version=$SPDX_VERSION, packages=$PACKAGE_COUNT"

          echo "## SBOM Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| SPDX Version    | $SPDX_VERSION |" >> $GITHUB_STEP_SUMMARY
          echo "| Package Count   | $PACKAGE_COUNT |" >> $GITHUB_STEP_SUMMARY
          echo "| SPDX artifact   | ${{ steps.set-artifact-name.outputs.name }}.spdx.json |" >> $GITHUB_STEP_SUMMARY
          echo "| CycloneDX artifact | ${{ steps.set-artifact-name.outputs.name }}.cyclonedx.json |" >> $GITHUB_STEP_SUMMARY

  attach-to-release:
    name: Attach SBOM to Release
    runs-on: ubuntu-latest
    needs: generate-sbom
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.attach_to_release == true)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SPDX SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: "${{ needs.generate-sbom.outputs.sbom_artifact_name }}.spdx.json"
          path: sbom-artifacts/

      - name: Download CycloneDX SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: "${{ needs.generate-sbom.outputs.sbom_artifact_name }}.cyclonedx.json"
          path: sbom-artifacts/

      - name: Determine release tag
        id: release-tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            # For workflow_dispatch, attach to the latest release
            TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
            echo "tag=$TAG" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach SBOM files to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.release-tag.outputs.tag }}"
          echo "Attaching SBOMs to release: $RELEASE_TAG"

          for f in sbom-artifacts/*.json; do
            echo "Uploading: $f"
            gh release upload "$RELEASE_TAG" "$f" --clobber
          done

          echo "## SBOM Attached to Release $RELEASE_TAG" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following SBOM files have been attached to the release:" >> $GITHUB_STEP_SUMMARY
          for f in sbom-artifacts/*.json; do
            echo "- $(basename $f)" >> $GITHUB_STEP_SUMMARY
          done

  scan-sbom:
    name: Scan SBOM for Vulnerabilities (Grype)
    runs-on: ubuntu-latest
    needs: generate-sbom
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download SPDX SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: "${{ needs.generate-sbom.outputs.sbom_artifact_name }}.spdx.json"
          path: sbom-artifacts/

      - name: Scan SBOM with Grype
        uses: anchore/scan-action@v4
        id: grype
        with:
          sbom: "sbom-artifacts/${{ needs.generate-sbom.outputs.sbom_artifact_name }}.spdx.json"
          severity-cutoff: high
          output-format: sarif
          fail-build: false

      - name: Upload Grype SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-sbom-scan

      - name: Upload Grype SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-sbom-sarif-${{ github.run_id }}
          path: ${{ steps.grype.outputs.sarif }}
          retention-days: 30
