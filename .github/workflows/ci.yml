name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test

jobs:
  # テンプレートリポジトリ対応: package.json が存在しない間は
  # npm 前提のジョブを skip し、プロジェクト適用時に自動で有効化される
  check-project:
    name: Check Project Type
    runs-on: ubuntu-latest
    outputs:
      has-package: ${{ steps.check.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for package.json
        id: check
        run: echo "exists=$([ -f package.json ] && echo true || echo false)" >> $GITHUB_OUTPUT

  lint:
    name: Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: check-project
    if: needs.check-project.outputs.has-package == 'true'
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "18.x"
          - "20.x"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint -- --format=github

      - name: Run Prettier check
        run: npm run format:check

      - name: Run TypeScript type check
        run: npm run typecheck

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "18.x"
          - "20.x"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage -- --reporter=github-actions --reporter=json-summary
        env:
          CI: true

      - name: Upload coverage report (Node ${{ matrix.node-version }})
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-node-${{ matrix.node-version }}-${{ github.run_id }}
          path: |
            coverage/
            !coverage/**/*.map
          retention-days: 14

      - name: Report coverage summary to PR
        if: github.event_name == 'pull_request' && matrix.node-version == '20.x'
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json

  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "18.x"
          - "20.x"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "::error::Build output directory 'dist' not found"
            exit 1
          fi
          echo "Build output size:"
          du -sh dist/

      - name: Upload build artifacts (Node ${{ matrix.node-version }})
        uses: actions/upload-artifact@v4
        with:
          name: build-node-${{ matrix.node-version }}-${{ github.run_id }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
